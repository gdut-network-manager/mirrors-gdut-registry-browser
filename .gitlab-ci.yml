image: registry.gdut.edu.cn/docker/library/ubuntu:22.04

stages:
  - check
  - image-build
  - signing

cache:
  paths:
    - cache

sonarqube-check:
  image: 
    name: registry.gdut.edu.cn/docker/sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  stage: check
  tags:
    - dev
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script: 
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

github-mirror:
  stage: check
  image: ubuntu:latest
  tags:
    - dev
  before_script:
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
  script:
    - |
      if [ -z "$GITHUB_REPO" ] || [ -z "$GITHUB_TOKEN" ]; then
        echo "GITHUB_REPO or GITHUB_TOKEN is not set, skipping..."
        exit 0
      fi
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_REPO#https://}"
    - git push github HEAD:${CI_COMMIT_REF_NAME} --force
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

docker-build-and-push:
  image: registry.gdut.edu.cn/docker/library/docker:stable
  stage: image-build
  tags:
    - Docker
  services:
    - name: docker:stable
  variables:
    DOCKER_CLI_EXPERIMENTAL: "enabled"
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "=========================== EXTRACT APP VERSION ============================"
    - export APP_VERSION=$(grep 'config.x.version' config/initializers/version.rb | head -1 | awk -F'"' '{print $2}')
    - echo "APP_VERSION=${APP_VERSION}"
    - echo "============================= LOGIN TO HARBOR =============================="
    - docker login -u ${USERNAME} -p ${PASSWORD} ${HARBORHOST}
    - echo "======================== CHECK IF IMAGE ALREADY EXISTS ====================="
    - |
      if docker manifest inspect ${HARBORHOST}/docker-registry-browser/docker-registry-browser:${APP_VERSION} >/dev/null 2>&1; then
        echo "Image ${APP_VERSION} already exists, skipping build"
        echo "SKIP_DOCKER=true" >> build.env
      else
        echo "=========================== BUILD DOCKER IMAGES ============================"
        docker build -t ${HARBORHOST}/docker-registry-browser/docker-registry-browser:${APP_VERSION} .
        echo "========================== TAG IMAGES WITH LATEST =========================="
        docker tag ${HARBORHOST}/docker-registry-browser/docker-registry-browser:${APP_VERSION} ${HARBORHOST}/docker-registry-browser/docker-registry-browser:latest
        echo "========================== PUSH IMAGES TO HARBOR ==========================="
        docker push ${HARBORHOST}/docker-registry-browser/docker-registry-browser:${APP_VERSION}
        docker push ${HARBORHOST}/docker-registry-browser/docker-registry-browser:latest
        echo "============================= CLEAN UP MIRRORS ============================="
        docker rmi ${HARBORHOST}/docker-registry-browser/docker-registry-browser:${APP_VERSION}
        echo "SKIP_DOCKER=false" >> build.env
      fi
    - echo "APP_VERSION=${APP_VERSION}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 30 min
  only:
    - master

helm-build:
  image: registry.gdut.edu.cn/docker/dtzar/helm-kubectl:3.8.0
  stage: image-build
  tags:
    - dev
  before_script:
    - export KUBECONFIG=$CI_PROJECT_DIR/kubeconfig
    - echo "$KUBECONFIG_DATA" | base64 -d > $KUBECONFIG
    - helm repo add stable https://charts.helm.sh/stable
    - helm repo update
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "========================== EXTRACT CHART VERSION ==========================="
    - export CHART_VERSION=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
    - echo "CHART_VERSION=${CHART_VERSION}"
    - echo "============================= LOGIN TO HARBOR =============================="
    - helm registry login ${HARBORHOST} --username ${USERNAME} --password ${PASSWORD}
    - echo "======================== CHECK IF CHART ALREADY EXISTS ====================="
    - |
      if helm pull oci://${HARBORHOST}/docker-registry-browser/docker-registry-browser-helm --version ${CHART_VERSION} 2>/dev/null; then
        rm -f docker-registry-browser-helm-*.tgz
        echo "Chart ${CHART_VERSION} already exists, skipping build"
        echo "SKIP_CHART=true" >> build.env
      else
        echo "============================== PACKAGE CHART ==============================="
        helm package helm --version ${CHART_VERSION}
        echo "=============================== PUSH CHARTS ================================"
        helm push docker-registry-browser-helm* oci://${HARBORHOST}/docker-registry-browser
        echo "SKIP_CHART=false" >> build.env
      fi
    - echo "CHART_VERSION=${CHART_VERSION}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 30 min
  only:
    - master

image-sign:
  image: registry.gdut.edu.cn/docker/library/ubuntu:22.04
  stage: signing
  tags:
    - dev
  needs:
    - job: docker-build-and-push
      artifacts: true
    - job: helm-build
      artifacts: true
  before_script:
    - echo "============================ CHANGE APT MIRROR ============================="
    - echo 'deb http://mirrors.gdut.edu.cn/ubuntu/ jammy main restricted universe multiverse
      deb-src http://mirrors.gdut.edu.cn/ubuntu/ jammy main restricted universe multiverse
      deb http://mirrors.gdut.edu.cn/ubuntu/ jammy-updates main restricted universe multiverse
      deb-src http://mirrors.gdut.edu.cn/ubuntu/ jammy-updates main restricted universe multiverse
      deb http://mirrors.gdut.edu.cn/ubuntu/ jammy-backports main restricted universe multiverse
      deb-src http://mirrors.gdut.edu.cn/ubuntu/ jammy-backports main restricted universe multiverse
      deb http://mirrors.gdut.edu.cn/ubuntu/ jammy-security main restricted universe multiverse
      deb-src http://mirrors.gdut.edu.cn/ubuntu/ jammy-security main restricted universe multiverse' > /etc/apt/sources.list
    - apt update -y
    - echo "=============================== INSTALL CURL ==============================="
    - apt install curl -y
  script:
    - echo "================================= LOAD ENV ================================="
    - env
    - echo "APP_VERSION=${APP_VERSION}"
    - echo "CHART_VERSION=${CHART_VERSION}"
    - echo "SKIP_DOCKER=${SKIP_DOCKER}"
    - echo "SKIP_CHART=${SKIP_CHART}"
    - echo "============================== INSTALL COSIGN =============================="
    - curl -fL -o cosign_1.6.0_amd64.deb --insecure "https://cn-gz-1.minio.gdutnic.com/gdutnic/public/cosign_1.6.0_amd64.deb"
    - dpkg -i cosign_1.6.0_amd64.deb
    - mv /usr/local/bin/cosign-linux-amd64 /usr/local/bin/cosign
    - echo "=============================== KEY GENERATE ==============================="
    - export COSIGN_PASSWORD=$PASSWORD
    - cosign generate-key-pair
    - echo "============================= LOGIN TO HARBOR =============================="
    - cosign login -u ${USERNAME} -p ${PASSWORD} ${HARBORHOST}
    - echo "=============================== IMAGE SIGN ================================="
    - |
      if [ "${SKIP_DOCKER}" = "true" ]; then
        echo "Docker image was not built, skipping image signing"
      else
        cosign sign --key cosign.key ${HARBORHOST}/docker-registry-browser/docker-registry-browser:latest
      fi
    - echo "================================ CHART SIGN ================================"
    - |
      if [ "${SKIP_CHART}" = "true" ]; then
        echo "Helm chart was not built, skipping chart signing"
      else
        cosign sign --key cosign.key ${HARBORHOST}/docker-registry-browser/docker-registry-browser-helm:${CHART_VERSION}
      fi
    - echo "========================== FIX FILE PERMISSIONS ============================"
    - chmod 644 cosign.key cosign.pub
    - ls -la cosign.*
  artifacts:
    paths:
      - cosign.key
      - cosign.pub
    expire_in: 30 min
  only:
    - master
